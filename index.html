<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Felices 18</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:'Poppins', sans-serif;
}

/* -------------------- */
/* PANTALLA INICIAL */
/* -------------------- */

#inicio{
  position:absolute;
  inset:0;

  background:url('fondo.jpg') center/cover no-repeat;

  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
}

#inicio::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

.contenido{
  position:relative;
  z-index:1;
  padding:20px;
}

h1{
  font-family:'Great Vibes', cursive;
  font-size:7rem;
  color:#ffc1d9; /* rosa clarito */
  text-shadow:0 0 20px rgba(255,255,255,0.8);
  margin-bottom:15px;
}

.sub{
  font-size:2rem;
  margin-bottom:25px;
}

#contador{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
}

.caja{
  background:rgba(255,255,255,0.15);
  padding:20px;
  border-radius:20px;
  min-width:110px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 15px rgba(255,255,255,0.1);
}

.numero{
  font-size:2.2rem;
  font-weight:700;
}

/* -------------------- */
/* VIDEO FINAL */
/* -------------------- */

#videoFinal{
  position:absolute;
  inset:0;
  display:none;
  background:black;
}

#videoFinal video{
  width:100%;
  height:100%;
  object-fit:cover;
}

@media (max-width:768px){

  h1{
    font-size:5rem;
  }

  .sub{
    font-size:1.5rem;
  }
}

</style>
</head>

<body>

<!-- CONTADOR -->

<div id="inicio">

  <div class="contenido">

    <h1>Felices 18 🎂</h1>

    <div class="sub">se desbloquea en:</div>

    <div id="contador">

      <div class="caja">
        <div class="numero" id="dias">00</div>
        <div>DÍAS</div>
      </div>

      <div class="caja">
        <div class="numero" id="horas">00</div>
        <div>HORAS</div>
      </div>

      <div class="caja">
        <div class="numero" id="minutos">00</div>
        <div>MINUTOS</div>
      </div>

      <div class="caja">
        <div class="numero" id="segundos">00</div>
        <div>SEGUNDOS</div>
      </div>

    </div>

  </div>

</div>

<!-- VIDEO -->

<div id="videoFinal">

  <video id="videoCumple" controls autoplay loop playsinline>

    <source src="videoprueba.mp4" type="video/mp4">

  </video>

</div>

<script>

/* FECHA DEL CUMPLEAÑOS */

const fecha = new Date("2026-08-20T01:00:00");

function actualizar(){

  const ahora = new Date();

  const diferencia = fecha - ahora;

  /* CUANDO EL CONTADOR LLEGUE A 0 */

  if(diferencia <= 0){

    document.getElementById("inicio").style.display = "none";

    document.getElementById("videoFinal").style.display = "block";

    const video = document.getElementById("videoCumple");

    video.play();

    return;
  }

  document.getElementById("dias").textContent =
    Math.floor(diferencia / (1000*60*60*24));

  document.getElementById("horas").textContent =
    Math.floor((diferencia / (1000*60*60)) % 24);

  document.getElementById("minutos").textContent =
    Math.floor((diferencia / (1000*60)) % 60);

  document.getElementById("segundos").textContent =
    Math.floor((diferencia / 1000) % 60);
}

actualizar();

setInterval(actualizar, 1000);

</script>

</body>
</html>
